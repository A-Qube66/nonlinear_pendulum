[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nonlinear-pendulum-lab"
version = "1.0.0"
description = "Interactive nonlinear pendulum simulation powered by scipy.solve_ivp"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "numpy>=2.2,<3",
    "scipy>=1.15,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

